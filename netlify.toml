[build]
  command = "bash -c 'if [ -d flutter ]; then cd flutter && git fetch && git checkout stable && git pull && cd ..; else git clone https://github.com -b stable; fi; ./flutter/bin/flutter config --enable-web; ./flutter/bin/flutter build web --wasm --no-tree-shake-icons --source-maps --release --web-renderer skwasm'"
  publish = "build/web"

# 啟用 Cross-Origin 隔離以提升 WASM 與 Shader 渲染效能
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/main.dart.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/flutter_service_worker.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "http://*"
  to = "https://:splat"
  status = 301
  force = true
