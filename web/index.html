<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Cache Control - Force fresh assets on updates -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <!-- Primary Meta Tags -->
  <meta name="title" content="輕鐵到站時間 | LRT Next Train">
  <meta name="description" content="香港輕鐵實時到站資訊查詢 | Hong Kong Light Rail real-time arrival information">
  <meta name="keywords" content="輕鐵,LRT,Light Rail,香港,Hong Kong,到站時間,arrival time,實時,real-time,班次,schedule,港鐵,MTR">
  <meta name="author" content="LRT Next Train">
  <meta name="language" content="zh-HK">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://lrt-next-train.netlify.app/">
  <meta property="og:title" content="輕鐵到站時間 | LRT Next Train">
  <meta property="og:description" content="香港輕鐵實時到站資訊查詢 | Hong Kong Light Rail real-time arrival information">
  <meta property="og:image" content="icons/Icon-512.svg">
  <meta property="og:locale" content="zh_HK">
  <meta property="og:locale:alternate" content="en_HK">
  
  <!-- Twitter -->
  <meta property="twitter:card" content="summary">
  <meta property="twitter:url" content="https://lrt-next-train.netlify.app/">
  <meta property="twitter:title" content="輕鐵到站時間 | LRT Next Train">
  <meta property="twitter:description" content="香港輕鐵實時到站資訊查詢 | Hong Kong Light Rail real-time arrival information">
  <meta property="twitter:image" content="icons/Icon-512.svg">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="輕鐵到站">
  <meta name="application-name" content="LRT Next Train">
  
  <!-- Theme color with dark/light mode support -->
  <meta name="theme-color" content="#F67C0F" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#D66A0C" media="(prefers-color-scheme: dark)">
  <meta name="msapplication-TileColor" content="#F67C0F">
  <meta name="msapplication-navbutton-color" content="#F67C0F">
  
  <link rel="apple-touch-icon" href="icons/Icon-192.svg">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon2.svg"/>

  <title>輕鐵到站時間 | LRT Next Train</title>
  <link rel="manifest" href="manifest.json">

  <!-- 如果您使用 DATA.GOV.HK 的主 API -->
  <link rel="preconnect" href="https://data.gov.hk">

  <!-- 如果您使用其後端數據查詢接口 (常見於應用數據集) -->
  <link rel="preconnect" href="https://app.data.gov.hk">

  <!-- 如果您使用地理位置或地圖相關 API (注意：2026年起將全面改為 www.map.gov.hk) -->
  <link rel="preconnect" href="https://www.map.gov.hk">
  <link rel="preconnect" href="https://geodata.gov.hk"> 
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>


  <!-- 建議同時加入 dns-prefetch 作為備援 -->
  <link rel="dns-prefetch" href="https://data.gov.hk">

</head>
<body>
  <script>
    window.addEventListener('load', function(ev) {
      // 1. 自動偵測最佳渲染器
      const useCanvasKit = (function() {
        const canvas = document.createElement('canvas');
        const supportsWebGL = !!window.WebGLRenderingContext && 
          (canvas.getContext('webgl') || canvas.getContext('experimental-webgl'));
        // 額外判斷：如果是舊款行動裝置，通常 html 渲染器較流暢，此處可視需求調整
        return supportsWebGL;
      })();

      // 2. 執行 Flutter 加載器
      _flutter.loader.load({
        config: {
          // 支援 WebGL 就用 canvaskit，否則回退到 html 以保證相容性
          renderer: useCanvasKit ? "canvaskit" : "html",
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.runApp();
        }
      });
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
